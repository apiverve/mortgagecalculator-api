openapi: 3.0.4
info:
  title: Mortgage Calculator
  description: >-
    Mortgage Calculator computes monthly and annual loan payments from
    principal, interest rate, and term. It breaks totals down by principal,
    interest, property tax, insurance, and HOA dues and returns the
    loan-to-value ratio, with paid plans adding full amortization schedules, PMI
    and its removal date, payoff dates, and extra-payment scenarios showing
    months and interest saved.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/mortgagecalculator:
    post:
      summary: Mortgage Calculator
      description: >-
        Calculate mortgage payments based on the loan amount, interest rate, and
        loan term, with optional PMI, a start date for payoff dates, and an
        extra monthly principal scenario
      operationId: mortgagecalculator
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  amount: 570000
                  downpayment: 57000
                  rate: 6.8
                  years: 30
                  total_interest_paid: 690975.44
                  total_loan_payment: 1203975.44
                  interestRatio: 57.39
                  monthly_payment:
                    total: 3558.13
                    mortgage: 3344.38
                    property_tax: 0
                    hoa: 0
                    home_insurance: 0
                    pmi: 213.75
                  annual_payment:
                    total: 42697.51
                    mortgage: 40132.51
                    property_tax: 0
                    hoa: 0
                    home_insurance: 0
                    pmi: 2565
                  formatted:
                    amount: $570,000
                    monthlyPayment: $3,344.38
                    totalInterestPaid: $690,975.44
                    totalLoanPayment: $1,203,975.44
                  loan_amount: 513000
                  ltv: 90
                  payoff_date: 2056-11
                  pmi:
                    required: true
                    rate: 0.5
                    monthly: 213.75
                    months_charged: 113
                    removal_month: 114
                    total: 24153.75
                    removal_date: 2036-05
                  extra_payments:
                    monthly: 200
                    months_to_payoff: 304
                    months_saved: 56
                    total_interest_paid: 563208.85
                    interest_saved: 127766.58
                    payoff_date: 2052-03
                  amortization_schedule:
                    - month: 1
                      interest_payment: 2907
                      principal_payment: 437.38
                      remaining_balance: 512562.62
                      date: 2026-12
                    - month: 2
                      interest_payment: 2904.52
                      principal_payment: 439.85
                      remaining_balance: 512122.77
                      date: 2027-01
                    - month: 3
                      interest_payment: 2902.03
                      principal_payment: 442.35
                      remaining_balance: 511680.42
                      date: 2027-02
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: The loan amount
                rate:
                  type: number
                  description: The interest rate (percentage)
                years:
                  type: integer
                  description: The loan term in years
                downpayment:
                  type: number
                  description: The down payment amount
                annual_propertytax:
                  type: number
                  description: The annual property tax amount
                annual_homeinsurance:
                  type: number
                  description: The annual home insurance amount
                annual_hoa:
                  type: number
                  description: The annual HOA amount
                pmi_rate:
                  type: number
                  description: >-
                    Annual private mortgage insurance rate as a percentage of
                    the loan, charged only when the loan-to-value ratio is above
                    80%
                extra_monthly:
                  type: number
                  description: >-
                    Extra principal paid every month, to see how much sooner the
                    loan is paid off and how much interest that saves
                start_date:
                  type: string
                  description: >-
                    Loan start (closing) date; the first payment falls the
                    following month
              required:
                - amount
                - rate
                - years
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  amount: 570000
  rate: 6.8
  years: 30
  downpayment: 57000
  pmi_rate: 0.5
  extra_monthly: 200
  start_date: '2026-11-01'
